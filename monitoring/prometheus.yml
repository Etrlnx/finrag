global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: finrag
    environment: development

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # FinRAG API metrics
  - job_name: 'finrag-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:8000']
        labels:
          service: 'finrag-api'
          component: 'api'

  # FinRAG Streamlit (if it exposes metrics)
  - job_name: 'finrag-streamlit'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['streamlit:8501']
        labels:
          service: 'finrag-streamlit'
          component: 'frontend'

  # Node exporter (host metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']
        labels:
          service: 'node-exporter'

  # cAdvisor for container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          service: 'cadvisor'

  # PostgreSQL exporter
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['host.docker.internal:9187']
        labels:
          service: 'postgres-exporter'