server:
  http_listen_port: 9080
  grpc_listen_port: 9081

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    pipeline_stages:
      - docker: {}
      - labels:
          container_name:
          image:
          compose_service:
      - match:
          selector: '{container_name=~"finrag-.*"}'
          action: keep
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker-containers
          __path__: /var/lib/docker/containers/*/*-json.log

  - job_name: finrag-api-logs
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            logger: logger
            request_id: request_id
            latency_ms: latency_ms
            status_code: status_code
      - labels:
          level:
          logger:
          request_id:
    static_configs:
      - targets:
          - localhost
        labels:
          job: finrag-api
          service: api
          __path__: /var/log/finrag/api/*.log

  - job_name: finrag-streamlit-logs
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
      - labels:
          level:
    static_configs:
      - targets:
          - localhost
        labels:
          job: finrag-streamlit
          service: streamlit
          __path__: /var/log/finrag/streamlit/*.log